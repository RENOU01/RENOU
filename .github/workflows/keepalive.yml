name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 10 */5 * *'  # Cada 5 dias a las 10am UTC
  workflow_dispatch:        # Permite ejecutarlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase para evitar pausa
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://utpgxsierjklrqnexeqt.supabase.co/rest/v1/avistamientos_publicos?select=id&limit=1" \
            -H "apikey: sb_publishable_9pLLVw8YfmUq1n0ll7fi2Q_Emtpc90e" \
            -H "Authorization: Bearer sb_publishable_9pLLVw8YfmUq1n0ll7fi2Q_Emtpc90e")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Ping exitoso - Supabase activo"
          else
            echo "Advertencia: respuesta inesperada $STATUS"
          fi
